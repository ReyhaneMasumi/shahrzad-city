name: PR Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: 'pr-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  pr-ok:
    if: always()
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any check failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
