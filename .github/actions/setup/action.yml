name: Setup pnpm and Node
description: Install pnpm, Node 22 from .nvmrc, and project dependencies with the pnpm store cache.

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        run_install: 'false'
    - name: Install Node
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
